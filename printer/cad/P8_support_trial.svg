<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1060" viewBox="0 0 1100 1060"
     data-paper-width="297" data-print-width="270" data-base-width="600"
     data-rail-rear-y="20" data-post-front-y="25" data-front-scale="1">
  <title>P8 stock-metal support comparison - NOT AN ORDER APPROVAL</title>
  <desc>Independent support for the X rail. Nominal layout only. No printed load-bearing P8.
    V-wheels, motor, nozzle and real slot fit NOT modelled.</desc>
  <rect width="1100" height="1060" fill="white"/>
  <style>
    text {font-family:Arial,sans-serif;fill:#171717;font-size:16px}
    .title {font-size:25px;font-weight:bold}
    .heading {font-size:19px;font-weight:bold}
    .small {font-size:14px}
    .dim {stroke:#333;stroke-width:1;fill:none}
    .metal {fill:#d4dde1;stroke:#283b43;stroke-width:1.5}
    .rail {fill:#455c69;stroke:#24323a;stroke-width:1.5}
    .bracket {fill:#ca8f25;stroke:#77500c;stroke-width:1}
    .hole {fill:white;stroke:#171717;stroke-width:1.3}
  </style>
  <text x="36" y="40" class="title">P8 - stock-metal X-axis support</text>
  <text x="36" y="67">SELECTED SUPPORT LAYOUT / NOT AN ORDER APPROVAL / mm / NOT TO SCALE</text>
  <text x="36" y="93" class="small">297 roll / 270 print unchanged. Corrected orientation for the 20mm-face small gantry.</text>

  <text x="50" y="140" class="heading">Front: X / Z</text>
  <text x="730" y="140" class="heading">Side: Y / Z (envelopes only)</text>
  <g id="front-layout" data-origin-x="380" data-origin-y="440">
    <rect id="front-crossbeam" class="metal" x="100" y="420" width="560" height="20"/>
    <rect id="front-left-post" class="metal" x="200" y="270" width="20" height="150"/>
    <rect id="front-right-post" class="metal" x="540" y="270" width="20" height="150"/>
    <rect id="front-rail" class="rail" x="130" y="340" width="500" height="20"/>
    <rect class="bracket" x="180" y="343" width="20" height="14"/>
    <rect class="bracket" x="220" y="343" width="20" height="14"/>
    <rect class="bracket" x="520" y="343" width="20" height="14"/>
    <rect class="bracket" x="560" y="343" width="20" height="14"/>
    <circle class="hole" cx="190" cy="350" r="2.75" data-part="rail-hole" data-x="-190" data-z="90" data-diameter="5.5"/>
    <circle class="hole" cx="230" cy="350" r="2.75" data-part="rail-hole" data-x="-150" data-z="90" data-diameter="5.5"/>
    <circle class="hole" cx="530" cy="350" r="2.75" data-part="rail-hole" data-x="150" data-z="90" data-diameter="5.5"/>
    <circle class="hole" cx="570" cy="350" r="2.75" data-part="rail-hole" data-x="190" data-z="90" data-diameter="5.5"/>
    <path class="dim" d="M210 240H550 M210 233V254 M550 233V254"/>
    <text x="310" y="230">340 post centres</text>
    <rect id="left-pipe-section" class="metal" x="160" y="402" width="15" height="15"/>
    <rect id="right-pipe-section" class="metal" x="585" y="402" width="15" height="15"/>
    <rect class="bracket" x="180" y="400" width="20" height="20"/>
    <rect class="bracket" x="220" y="400" width="20" height="20"/>
    <rect class="bracket" x="520" y="400" width="20" height="20"/>
    <rect class="bracket" x="560" y="400" width="20" height="20"/>
    <path class="dim" d="M100 465H660 M100 453V471 M660 453V471"/>
    <text x="310" y="491">560 crossbeam</text>
    <path class="dim" d="M231.5 515H528.5 M231.5 506V524 M528.5 506V524"/>
    <text x="299" y="548">297 paper width</text>
    <text x="270" y="314">500 rail, rear attachment only</text>
    <text x="140" y="190" class="small">Posts X=+/-170; feet end at +/-200; pipes start at +/-205.</text>
    <text x="140" y="455" class="small">Pipe Z=23..38; beam top Z=20. Nominal clearance only.</text>
  </g>

  <g id="side-layout" data-origin-y="20" data-post-y="35" data-y-scale="4">
    <rect id="side-rail" class="rail" x="740" y="340" width="160" height="20"/>
    <rect id="side-post" class="metal" x="920" y="270" width="80" height="150"/>
    <rect class="metal" x="920" y="420" width="80" height="20"/>
    <line class="dim" x1="900" y1="402" x2="920" y2="402"/>
    <line class="dim" x1="900" y1="390" x2="900" y2="410"/>
    <line class="dim" x1="920" y1="390" x2="920" y2="410"/>
    <text x="765" y="327" class="small">40 deep x 20 high</text>
    <text x="753" y="466">5 nominal rail/post gap</text>
    <text x="725" y="495" class="small">NOT a verified V-wheel clearance.</text>
    <text x="725" y="519" class="small">Bracket width: 14; legs: 20; thickness: 3.</text>
    <text x="725" y="543" class="small">Stock holes: 5.5; leg offsets: 10 / 15.</text>
  </g>

  <line x1="36" y1="575" x2="1064" y2="575" stroke="#bbb"/>
  <text x="36" y="606" class="heading">Additional support parts - baseline base frame NOT included</text>
  <g id="crossbeam" data-qty="1" data-mm="560,20,20" data-model="HFS5-2020-560">
    <text x="36" y="641">1 x HFS5-2020-560 crossbeam</text>
  </g>
  <g id="posts" data-qty="2" data-mm="20,20,150" data-model="HFS5-2020-150">
    <text x="36" y="674">2 x HFS5-2020-150 posts</text>
  </g>
  <g id="bracket-sets" data-qty="12" data-model="HBLSS5-SET" data-unit-net-krw="1912" data-quote-vat-krw="25238">
    <text x="36" y="707">12 x HBLSS5-SET: 4 beam ends + 4 post feet + 4 rear rail</text>
  </g>
  <g id="rail-nuts" data-qty="4" data-buy-qty="10" data-model="HD0008-S20M5=10">
    <text x="36" y="740">4 used / buy 1 lot of 10: HD0008-S20M5=10 (Bulk-Man rail only)</text>
  </g>
  <text x="36" y="781">SET includes 24 CBM5-8 + 24 HNTT5-5. No separate bolt order.</text>
  <text x="36" y="817">Replace 4 rail-side SET nuts with the Bulk-Man nuts.</text>
  <text x="36" y="853" class="small">Used: 24 bolts / 20 HFS5 nuts / 4 Bulk-Man nuts. Included spares: 4 HFS5 / 6 Bulk-Man.</text>
  <text x="36" y="889" class="small">12 SET quote: KRW 22,944 net / 25,238 incl. VAT. Reference dispatch: 2026-10-16.</text>
  <line x1="36" y1="924" x2="1064" y2="924" stroke="#bbb"/>
  <text x="36" y="953" class="heading">No load-bearing P8 print, pipe hole or pipe crush spacer in this comparison.</text>
  <text x="36" y="981" class="small">V-wheels, motor, nozzle and real slot fit NOT modelled. Paper support and P9 remain separate.</text>
  <text x="36" y="1008" class="small">HFS5 base required. Actual rear-slot/end-plate clearance, brace stiffness, price and delivery remain open.</text>
  <text x="36" y="1035" class="small">Buy stock brackets. This drawing is NOT a bracket fabrication drawing or a complete printer assembly.</text>
</svg>

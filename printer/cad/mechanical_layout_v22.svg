<svg xmlns="http://www.w3.org/2000/svg" width="1450" height="1160" viewBox="0 0 1450 1160">
  <title>v22 nominal frame, plate cutting and supply roll layout</title>
  <rect width="1450" height="1160" fill="white"/>
  <g fill="#161616" font-family="Arial, sans-serif">
    <text x="55" y="42" font-size="24">v22 / MECHANICAL INTEGRATION / TRIAL DIMENSIONS</text>
    <text x="55" y="70" font-size="15">Dimensions in mm. Fit, loads, roller radius and print clearance require hardware tests.</text>
    <text x="70" y="108" font-size="19">A. FRAME TOP VIEW / 600 x 440</text>
    <g id="frame-layout" data-platen-width="300" data-platen-depth="180" data-post-x="170" data-post-width="20" data-p9-x="140" data-p9-plate-width="60" data-corner-inner-x="182.2">
      <rect x="70" y="120" width="600" height="440" fill="none" stroke="#222" stroke-width="2"/>
      <g fill="#ddd" stroke="#333">
        <rect x="70" y="120" width="600" height="20"/>
        <rect x="70" y="540" width="600" height="20"/>
        <rect x="70" y="140" width="20" height="400"/>
        <rect x="650" y="140" width="20" height="400"/>
      </g>
      <g fill="#aaa" stroke="#555">
        <rect x="150" y="140" width="15" height="400"/>
        <rect x="575" y="140" width="15" height="400"/>
        <rect x="165" y="140" width="410" height="15"/>
        <rect x="165" y="525" width="410" height="15"/>
        <rect x="165" y="332.5" width="410" height="15"/>
      </g>
      <rect x="220" y="250" width="300" height="180" fill="#e7eef1" fill-opacity="0.88" stroke="#276176" stroke-width="2"/>
      <rect x="221.5" y="140" width="297" height="400" fill="none" stroke="#777" stroke-dasharray="5 5"/>
      <g stroke="#111" stroke-width="4">
        <path d="M150 210 H590 M150 470 H590"/>
      </g>
      <rect x="120" y="320" width="500" height="40" fill="none" stroke="#111" stroke-dasharray="3 3"/>
      <rect x="190" y="365" width="20" height="20" fill="#777"/>
      <rect x="530" y="365" width="20" height="20" fill="#777"/>
      <g fill="#c9ab7e" stroke="#6b5739">
        <rect x="200" y="120" width="60" height="50"/>
        <rect x="480" y="120" width="60" height="50"/>
        <rect x="200" y="510" width="60" height="50"/>
        <rect x="480" y="510" width="60" height="50"/>
      </g>
      <g fill="white" stroke="#276176">
        <circle cx="250" cy="324" r="2.25"/><circle cx="250" cy="356" r="2.25"/>
        <circle cx="490" cy="324" r="2.25"/><circle cx="490" cy="356" r="2.25"/>
      </g>
      <text x="265" y="291" font-size="16">300 x 180 x 3 platen</text>
      <text x="278" y="400" font-size="14">297 paper / 270 print</text>
      <text x="287" y="196" font-size="14">rear feed Y=-130</text>
      <text x="285" y="492" font-size="14">front feed Y=+130</text>
      <text x="95" y="596" font-size="14">P8 posts X=+/-170 / P9 plates X=+/-140</text>
      <text x="95" y="620" font-size="14">P12 saddles X=+/-120 / P14 tees at centre-pipe ends</text>
    </g>
    <text x="750" y="108" font-size="19">B. CUT ONE 600 x 400 x 3 ALUMINUM PLATE</text>
    <g transform="translate(750 120)" id="stock-sheet" data-width="600" data-height="400" data-thickness="3" data-kerf="3">
      <rect width="600" height="400" fill="#fafafa" stroke="#111" stroke-width="2"/>
      <rect data-part="roll-base" x="0" y="0" width="600" height="200" fill="#e1e1e1" stroke="#555"/>
      <rect data-part="platen" x="0" y="203" width="300" height="180" fill="#e7eef1" stroke="#276176"/>
      <g fill="#e8d5b8" stroke="#6b5739">
        <rect data-part="p9" x="303" y="203" width="60" height="50"/>
        <rect data-part="p9" x="366" y="203" width="60" height="50"/>
        <rect data-part="p9" x="303" y="256" width="60" height="50"/>
        <rect data-part="p9" x="366" y="256" width="60" height="50"/>
      </g>
      <text x="192" y="104" font-size="17">roll base / 600 x 200</text>
      <text x="47" y="300" font-size="17">platen / 300 x 180</text>
      <text x="441" y="245" font-size="15">P9 / 60 x 50 / 4 pcs</text>
      <text x="441" y="270" font-size="13">Use existing hole drawing.</text>
      <text x="335" y="350" font-size="14">remaining offcut</text>
    </g>
    <text x="770" y="556" font-size="14">3 mm cutting loss included. Stock is uncut; clamp and deburr all cuts.</text>
    <text x="770" y="582" font-size="14">No bespoke panel machining or welding is assumed.</text>
    <path d="M55 654 H1390" stroke="#aaa"/>
    <text x="70" y="700" font-size="19">C. SEPARATE SUPPLY ROLL / SIDE ENVELOPE</text>
    <g id="supply-roll" data-rod-length="520" data-stand-x="200" data-stand-width="60" data-core-width="297" data-rod-axis="100" data-roll-max-diameter="170">
      <rect x="185" y="990" width="300" height="4.5" fill="#aaa" stroke="#333"/>
      <rect x="245" y="978" width="180" height="12" fill="#777"/>
      <rect x="312.5" y="825" width="45" height="165" fill="#bbb" stroke="#333"/>
      <circle cx="335" cy="840" r="127.5" fill="none" stroke="#777" stroke-dasharray="7 5"/>
      <circle cx="335" cy="840" r="7.5" fill="white" stroke="#111" stroke-width="2"/>
      <path d="M453 894 L610 950" stroke="#111" stroke-width="2" fill="none"/>
      <text x="76" y="1010" font-size="15">P13 stand x2: 60 x 120 base / rod centre 100 high</text>
      <text x="76" y="1036" font-size="15">Bolt to the metal base; retain rod with a tie through each tunnel.</text>
      <text x="76" y="1062" font-size="15">Dotted circle: maximum 170 mm roll envelope, not measured roll size.</text>
      <text x="76" y="1088" font-size="15">Rod 520 / stands X=+/-200 / stock M10 nuts + washers.</text>
    </g>
    <text x="750" y="700" font-size="19">D. PLATEN SECTION / INITIAL HEIGHT DATUM</text>
    <g id="platen-section" data-pipe-top-z="38" data-saddle-rise="33.5" data-plate-thickness="3" data-platen-z="74.5" data-plate-bolt-length="60" data-clamp-bolt-length="50" data-base-bolt-length="20">
      <rect x="990" y="795.5" width="120" height="145.5" fill="#c7dce4" stroke="#276176"/>
      <rect x="1026.9" y="896" width="46.2" height="46.2" fill="white"/>
      <rect x="1027.5" y="896" width="45" height="45" fill="#aaa" stroke="#333"/>
      <rect x="1032" y="900.5" width="36" height="36" fill="white"/>
      <rect x="780" y="786.5" width="540" height="9" fill="#aaa" stroke="#333"/>
      <path d="M900 782 H1200" stroke="#111" stroke-width="2"/>
      <text x="800" y="754" font-size="15">paper plane / initial Z=74.5</text>
      <text x="1128" y="832" font-size="15">P12 saddle / 2 pcs</text>
      <text x="1128" y="857" font-size="15">rise 33.5 from pipe top</text>
      <text x="1128" y="913" font-size="15">15 x 15 pipe</text>
      <text x="775" y="991" font-size="15">4 M4 x60 countersunk plate bolts; 4 M4 x50 clamp bolts.</text>
      <text x="775" y="1017" font-size="15">M4 collars inside pipe prevent local crushing.</text>
      <text x="775" y="1043" font-size="15">Countersink the 4 plate holes flush; paper must not catch.</text>
      <text x="775" y="1069" font-size="15">Adjust height after measuring the actual coated feed roller.</text>
      <text x="775" y="1095" font-size="15">P1 head height is adjusted separately; no nozzle model shown.</text>
    </g>
    <text x="55" y="1130" font-size="14">TRIAL ONLY / top view uses nominal envelopes / not a strength, thermal or full moving-clearance approval</text>
  </g>
</svg>
